<!doctype html>
<html lang="en-GB">
	<head>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
		
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">

		<link rel="stylesheet" href="../index.css">
		<link rel="stylesheet" href="../schedule/schedule.css">

		<link rel="icon" type="image/svg+xml" href="../logo-red.svg">
		<title>Countdown</title>
		
		<style type="text/css">
			html {
				background: #000000;
				font-family: Ubuntu;
				font-weight: 500;
				color: #FFFFFF;
				height: 100%;
			}

			body {
				margin: 0;
				min-height: 100%;
				display: flex;
				flex-direction: column;
				background: #000000;
			}

			/* Completely hide top navbar in fullscreen mode[cite: 10] */
			body.fullscreen-mode #header {
				display: none !important;
				height: 0 !important;
				margin: 0 !important;
				padding: 0 !important;
				border: none !important;
			}

			.countdown-wrapper {
				flex: 1;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 20px;
				box-sizing: border-box;
			}

			.timer-form-card {
				background-color: #1a1a1a;
				border: none;
				border-radius: 24px;
				padding: 30px;
				width: 100%;
				max-width: 550px;
				display: flex;
				flex-direction: column;
				gap: 20px;
				box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
			}

			.form-row {
				display: flex;
				flex-direction: column;
				gap: 8px;
			}

			.form-row label {
				font-size: 14px;
				color: #aaaaaa;
			}

			.form-row input[type="text"],
			.form-row input[type="number"] {
				background-color: #2c2c2e;
				border: none;
				color: #ffffff;
				padding: 12px;
				border-radius: 10px;
				font-family: Ubuntu;
				font-size: 16px;
				outline: none;
				width: 100%;
				box-sizing: border-box;
			}

			.time-inputs {
				display: grid;
				grid-template-columns: repeat(3, 1fr);
				gap: 12px;
			}

			.start-btn {
				background-color: #444;
				color: #ffffff;
				border: none;
				padding: 14px;
				border-radius: 10px;
				font-family: Ubuntu;
				font-size: 16px;
				font-weight: 700;
				cursor: pointer;
				transition: background-color 0.2s;
			}

			.start-btn:hover {
				background-color: #666;
			}

			/* Running Timer Card UI with Increased Letter Spacing[cite: 10] */
			.running-card {
				position: relative;
				background-color: #1a1a1a;
				border: none;
				border-radius: 28px;
				padding: clamp(20px, 6vw, 50px) clamp(20px, 8vw, 70px);
				width: 100%;
				max-width: 850px;
				aspect-ratio: 16 / 9;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: space-between;
				box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
				box-sizing: border-box;
				text-align: center;
			}

			.close-x-btn {
				position: absolute;
				top: clamp(8px, 2vw, 16px);
				right: clamp(10px, 2.5vw, 18px);
				background: none;
				border: none;
				color: #8e8e93;
				font-size: clamp(1.2rem, 3vw, 1.5rem);
				cursor: pointer;
				width: 44px;
				height: 44px;
				display: flex;
				align-items: center;
				justify-content: center;
				border-radius: 50%;
				padding: 0;
				transition: color 0.2s;
			}

			.close-x-btn:hover {
				color: #ffffff;
			}

			.running-name {
				font-size: clamp(1rem, 3.5vw, 1.4rem);
				font-weight: 400;
				color: #ffffff;
				width: 80%;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}

			.running-time {
				font-size: clamp(2.5rem, 12vw, 6.5rem);
				font-weight: 500;
				font-family: Ubuntu, sans-serif;
				letter-spacing: 1px; /* Increased kerning/spacing[cite: 10] */
				color: #ffffff;
				line-height: 1;
			}

			.running-meta {
				display: flex;
				align-items: center;
				gap: 6px;
				font-size: clamp(0.85rem, 2.5vw, 1.1rem);
				color: #8e8e93;
			}

			.control-btn {
				background-color: #2c2c2e;
				border: none;
				width: clamp(44px, 10vw, 60px);
				height: clamp(44px, 10vw, 60px);
				border-radius: 50%;
				display: flex;
				align-items: center;
				justify-content: center;
				cursor: pointer;
				transition: background-color 0.2s;
			}

			.control-btn:hover {
				background-color: #3a3a3c;
			}

			.control-icon {
				fill: #ffffff;
				width: clamp(16px, 4vw, 22px);
				height: clamp(16px, 4vw, 22px);
			}
		</style>
	</head>
	
	<body>
		<div id="header">
			<span>Countdown</span>
			<div id="header-right">
				<a id="home" href="/">Home</a>
			</div>
		</div>
		
		<div class="countdown-wrapper" id="main-container"></div>

		<script>
			let timerState = JSON.parse(localStorage.getItem('singleCountdownTimer')) || null;

			function saveState() {
				localStorage.setItem('singleCountdownTimer', JSON.stringify(timerState));
			}

			function startTimer() {
				const nameInput = document.getElementById('timer-name');
				const hoursInput = document.getElementById('timer-hours');
				const minutesInput = document.getElementById('timer-minutes');
				const secondsInput = document.getElementById('timer-seconds');

				const name = nameInput.value.trim() || ' ';
				const hours = parseInt(hoursInput.value) || 0;
				const minutes = parseInt(minutesInput.value) || 0;
				const seconds = parseInt(secondsInput.value) || 0;

				const totalSeconds = (hours * 3600) + (minutes * 60) + seconds;
				if (totalSeconds <= 0) {
					alert('Please enter a valid time greater than 0.');
					return;
				}

				const now = Date.now();
				const endTime = now + (totalSeconds * 1000);
				const targetDate = new Date(endTime);
				const endFormatted = targetDate.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

				timerState = {
					name: name,
					totalSeconds: totalSeconds,
					remainingSeconds: totalSeconds,
					endTime: endTime,
					isRunning: true,
					endFormatted: endFormatted
				};

				saveState();
				render();
			}

			function togglePause() {
				if (!timerState) return;
				if (timerState.isRunning) {
					const now = Date.now();
					timerState.remainingSeconds = Math.max(0, Math.ceil((timerState.endTime - now) / 1000));
					timerState.isRunning = false;
				} else {
					timerState.endTime = Date.now() + (timerState.remainingSeconds * 1000);
					const targetDate = new Date(timerState.endTime);
					timerState.endFormatted = targetDate.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
					timerState.isRunning = true;
				}
				saveState();
				render();
			}

			function resetTimer() {
				timerState = null;
				localStorage.removeItem('singleCountdownTimer');
				render();
			}

			function render() {
				const container = document.getElementById('main-container');

				if (!timerState) {
					container.innerHTML = `
						<div class="timer-form-card">
							<div class="form-row">
								<label for="timer-name">Timer Name</label>
								<input type="text" id="timer-name" placeholder="Enter a name..." autocomplete="off" value="">
							</div>
							<div class="time-inputs">
								<div class="form-row">
									<label for="timer-hours">Hours</label>
									<input type="number" id="timer-hours" min="0" value="1">
								</div>
								<div class="form-row">
									<label for="timer-minutes">Minutes</label>
									<input type="number" id="timer-minutes" min="0" max="59" value="45">
								</div>
								<div class="form-row">
									<label for="timer-seconds">Seconds</label>
									<input type="number" id="timer-seconds" min="0" max="59" value="0">
								</div>
							</div>
							<button class="start-btn" onclick="startTimer()">Start Timer</button>
						</div>
					`;
				} else {
					// Only build the running card shell once if it doesn't already exist
					if (!container.querySelector('.running-card')) {
						container.innerHTML = `
							<div class="running-card">
								<button class="close-x-btn" onclick="resetTimer()" title="Close Timer">&times;</button>
								<div class="running-name"></div>
								<div class="running-time"></div>
								<div class="running-meta"></div>
								<button class="control-btn" onclick="togglePause()">
									<svg class="control-icon" viewBox="0 0 24 24"></svg>
								</button>
							</div>
						`;
					}
					updateRunningCardValues();
				}
			}

			function updateRunningCardValues() {
				if (!timerState) return;
				const card = document.querySelector('.running-card');
				if (!card) return;

				let diffSeconds = timerState.remainingSeconds;
				if (timerState.isRunning) {
					const now = Date.now();
					diffSeconds = Math.max(0, Math.ceil((timerState.endTime - now) / 1000));
					if (diffSeconds === 0 && timerState.isRunning) {
						timerState.isRunning = false;
					}
				}

				const h = Math.floor(diffSeconds / 3600);
				const m = Math.floor((diffSeconds % 3600) / 60);
				const s = diffSeconds % 60;
				const timeStr = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
				
				const iconPath = timerState.isRunning 
					? '<path d="M6 4h4v16H6zm8 0h4v16h-4z"/>' 
					: '<path d="M8 5v14l11-7z"/>';

				card.querySelector('.running-name').textContent = timerState.name;
				card.querySelector('.running-time').textContent = timeStr;
				card.querySelector('.running-meta').textContent = timerState.endFormatted;
				
				const controlBtn = card.querySelector('.control-btn');
				controlBtn.title = timerState.isRunning ? 'Pause' : 'Play';
				card.querySelector('.control-icon').innerHTML = iconPath;
			}

			function checkFullscreen() {
				if (document.fullscreenElement || document.webkitFullscreenElement || window.innerHeight === screen.height) {
					document.body.classList.add('fullscreen-mode');
				} else {
					document.body.classList.remove('fullscreen-mode');
				}
			}

			document.addEventListener('fullscreenchange', checkFullscreen);
			document.addEventListener('webkitfullscreenchange', checkFullscreen);
			window.addEventListener('resize', checkFullscreen);

			// Update only the numbers/icons smoothly without destroying the DOM elements
			setInterval(() => {
				if (timerState && timerState.isRunning) {
					updateRunningCardValues();
				}
			}, 250);

			render();
			checkFullscreen();
		</script>
	</body>
</html>
